<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Title</title>
</head>
<body class="body">
<form id="contact-form" class="form">
    <h1>We would like to help you</h1>
    <label>
        <input class="form__input" type="text" name="name" placeholder="Name">
        <span id="error-name" class="error"></span>
    </label>
    <label>
        <textarea class="form__input" name="message" placeholder="Message" rows="4"></textarea>
    </label>
    <h2>How to answer you?</h2>
    <label>
        <input class="form__input" type="text" name="phone" placeholder="Phone number">
        <span id="error-phone" class="error"></span>
    </label>
    <label>
        <input class="form__input" type="text" name="email" placeholder="Email">
        <span id="error-email" class="error"></span>
    </label>
    <button id="submit-btn" class="btn" type="submit">Send message</button>
</form>
