<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
</head>
<body class="body">
<div class="wrapper">
    <h1>Movie Collection</h1>
    <section class="add-movie">
        <h2>Add a New Movie</h2>
        <form id="add-movie-form">
            <label>
                <input type="text" placeholder="Movie title" name="title">
            </label>
            <label>
                <input type="text" placeholder="Director" name="director">
            </label>
            <label>
                <input type="number" placeholder="Year" name="year" max="2025" min="1888">
            </label>
            <button type="submit">Add Movie</button>
        </form>
    </section>
    <section class="movies">
        <h2>Movie List</h2>
        <ul id="movie-list" class="movies"></ul>
    </section>
</div>

</body>
</html>
