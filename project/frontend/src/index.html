<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="body">
<div class="todo">
    <h1>ToDoList</h1>
    <form id="todo-form" class="form form_create">
        <label>
            <input type="text" name="title" placeholder="Title">
        </label>
        <label>
            <input type="text" name="description" placeholder="Enter task details (optional)">
        </label>
        <button class="add-btn js-add-btn" type="submit">
            <svg width="30px" height="23px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M4 12H20M12 4V20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
        </button>
    </form>
    <ul id="todo-list" class="todo__list"></ul>
</div>
</body>
</html>
